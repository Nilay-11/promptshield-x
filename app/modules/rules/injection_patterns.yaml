# Pattern rules for the first-pass regex/keyword scanner (Ch. 6.2).
# severity: 0-100, contributes to risk_scoring.pattern_severity

- id: ignore-previous-instructions
  pattern: "(?i)ignore (all|any|the)? ?previous instructions"
  category: prompt_injection
  severity: 80

- id: ignore-above-instructions
  pattern: "(?i)ignore (all|any|the)? ?(above|prior|earlier) instructions"
  category: prompt_injection
  severity: 80

- id: disregard-instructions
  pattern: "(?i)disregard (all|any|the)? ?(previous|prior|above)? ?instructions"
  category: prompt_injection
  severity: 75

- id: forget-instructions
  pattern: "(?i)forget (everything|all) (you('| ha)ve been told|above)"
  category: prompt_injection
  severity: 75

- id: reveal-system-prompt
  pattern: "(?i)(reveal|show|print|output|tell me|what is) (the |your |hidden )+(original )?(system|hidden) prompt"
  category: prompt_extraction
  severity: 85

- id: repeat-instructions-verbatim
  pattern: "(?i)(repeat|print|output) (your|the) (instructions|prompt) (verbatim|exactly|word for word)"
  category: prompt_extraction
  severity: 85

- id: dan-jailbreak
  # also catches casual spellings: "your dan now", "you're DAN", "ur DAN", "u r dan"
  pattern: "(?i)\\b(act as( an?)?|(you('| a)?re|youre|your|ur|u r)( now)?|from now on (you('| a)?re|your|ur|u r))\\s+(now\\s+)?(a |an |the )?(DAN|unrestricted|jailbroken|Do Anything Now)\\b|\\b(act as( an?)?|you are( now)?|from now on you are)\\b.{0,40}\\b(DAN|unrestricted|jailbroken|Do Anything Now)\\b"
  category: jailbreak
  severity: 90

- id: you-are-now
  pattern: "(?i)\\b((you('| a)?re|youre|your|ur|u r) now|from now on (you('| a)?re|your|ur|u r))\\b.{0,40}\\b(unfiltered|unlocked|free|unrestricted|DAN)\\b"
  category: jailbreak
  severity: 85


- id: pretend-no-rules
  pattern: "(?i)pretend (you have |you're |you are )?no (rules|restrictions|guidelines|limitations)"
  category: jailbreak
  severity: 80

- id: hypothetical-jailbreak
  pattern: "(?i)in a (hypothetical|fictional) (scenario|world|story)( where)? (there are|with) no (rules|restrictions|laws)"
  category: jailbreak
  severity: 70

- id: bypass-safety
  pattern: "(?i)(bypass|disable|turn off|circumvent) (safety|content) (restrictions|filters|policy|guidelines)"
  category: prompt_injection
  severity: 85

- id: role-override
  pattern: "(?i)\\bnew instructions\\b.{0,30}\\b(override|replace|supersede)\\b"
  category: agent_manipulation
  severity: 70

- id: system-role-injection
  pattern: "(?i)\\[?(system|SYSTEM)\\]?\\s*:\\s*(you (are|must|will)|new instructions)"
  category: agent_manipulation
  severity: 75

- id: end-of-prompt-marker
  pattern: "(?i)(end of (system )?prompt|---\\s*end\\s*---|\\[/?INST\\])"
  category: agent_manipulation
  severity: 60

- id: extraction-via-translation
  pattern: "(?i)(translate|repeat) (your|the) (system prompt|instructions) (into|in|to) \\w+"
  category: prompt_extraction
  severity: 70